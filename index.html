<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Weather Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>Weather Intelligence</h1>
            <p>Predicting the perfect windows for your productivity.</p>
        </header>

        <section class="search-container">
            <input type="text" id="cityInput" placeholder="Enter city name..." value="Delhi">
            <button id="searchBtn">Fetch Live Intel</button>
        </section>

        <div id="errorMessage" class="error-panel" style="display: none;">
            <p id="errorText"></p>
        </div>

        <main id="dashboard" class="dashboard" style="display: none;">
            <div class="comfort-header">
                <div class="location-info">
                    <h2 id="cityNameDisplay">Delhi</h2>
                    <p id="currentStatus">Analyzing current atmospheric conditions...</p>
                </div>
                <div class="comfort-score">
                    <div class="score-label">Avg Comfort Score</div>
                    <div class="score-value" id="avgScore">--</div>
                </div>
            </div>

            <div class="recommendation-panel">
                <h3>🏆 Best Window to Study</h3>
                <p id="bestWindowText">Finding the sweet spot...</p>
            </div>

            <div class="hourly-grid" id="hourlyGrid">
                <!-- Cards will be injected here -->
            </div>
        </main>

        <div id="loader" class="loader-container" style="display: none;">
            <div class="spinner"></div>
            <p>Consulting satellites...</p>
        </div>

        <footer>
            <p>Built by Shivam Singh · IIT Patna · Day 1/35</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>

</html>
