<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Weather Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Weather Intelligence</h1>
            <p>Predicting the perfect windows for your productivity.</p>
        </header>

        <section class="search-container">
            <input type="text" id="cityInput" placeholder="Enter city name..." value="Delhi">
            <button id="searchBtn">Fetch Live Intel</button>
        </section>

        <main id="dashboard" class="dashboard" style="display: none;">
            <div class="comfort-header">
                <div class="location-info">
                    <h2 id="cityNameDisplay" style="font-size: 2rem; color: var(--accent-cyan);">Delhi</h2>
                    <p id="currentStatus" style="color: var(--text-dim);">Analyzing current atmospheric conditions...</p>
                </div>
                <div class="comfort-score">
                    <div class="score-label">Avg Comfort Score</div>
                    <div class="score-value" id="avgScore">--</div>
                </div>
            </div>

            <div class="recommendation-panel" style="background: var(--card-bg); padding: 1.5rem; border-radius: 20px; border: 1px solid var(--glass-border); text-align: center;">
                <h3 style="color: white; margin-bottom: 0.5rem;">🏆 Best Window to Study</h3>
                <p id="bestWindowText" style="color: var(--accent-amber); font-weight: 600;">Finding the sweet spot...</p>
            </div>

            <div class="hourly-grid" id="hourlyGrid">
                <!-- Cards will be injected here -->
            </div>
        </main>

        <div id="loader" style="text-align: center; display: none; margin-top: 5rem;">
            <div style="border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid var(--primary); border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 0 auto;"></div>
            <p style="margin-top: 1rem; color: var(--text-dim);">Consulting satellites...</p>
        </div>
    </div>

    <style>
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>

    <script src="app.js"></script>
</body>
</html>
